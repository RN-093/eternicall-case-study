<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">The post-call stage</title>
  <desc id="d">A call ends, the recording is transcribed, and the transcript is classified and summarised against the rules. Every call is written to the call log. Urgent labels also send an SMS alert carrying the summary and the label.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1B3A2D"/>
    </marker>
  </defs>
  <rect width="960" height="270" fill="#FFFFFF"/>
  <g fill="#FFFFFF" stroke="#1B3A2D" stroke-width="1.5">
    <rect x="30" y="95" width="160" height="80" rx="8"/>
    <rect x="250" y="95" width="160" height="80" rx="8"/>
    <rect x="470" y="95" width="200" height="80" rx="8"/>
    <rect x="750" y="30" width="180" height="80" rx="8"/>
    <rect x="750" y="160" width="180" height="80" rx="8"/>
  </g>
  <g fill="none" stroke="#1B3A2D" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M190 135 L248 135"/>
    <path d="M410 135 L468 135"/>
    <path d="M670 118 L748 80"/>
    <path d="M670 152 L748 190"/>
  </g>
  <g fill="#1B3A2D" text-anchor="middle">
    <g font-size="17" font-weight="600">
      <text x="110" y="131">Call ends</text>
      <text x="330" y="131">Transcribed</text>
      <text x="570" y="131">Classified</text>
      <text x="840" y="66">SMS alert</text>
      <text x="840" y="196">Call log</text>
    </g>
    <g font-size="13">
      <text x="110" y="153">the trigger</text>
      <text x="330" y="153">recording to text</text>
      <text x="570" y="153">label and summary, by the rules</text>
      <text x="840" y="88">urgent: summary and label</text>
      <text x="840" y="218">every call</text>
    </g>
  </g>
</svg>
